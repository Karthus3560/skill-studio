<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
<style>
  .f { animation-name: float; animation-iteration-count: infinite; animation-timing-function: ease-in-out; transform-box: fill-box; transform-origin: center; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  .t { animation: rise 1.2s cubic-bezier(.25,.46,.45,.94) both; }
  .s { animation: rise 1.2s .25s cubic-bezier(.25,.46,.45,.94) both; }
  .u { animation: draw 1.4s .5s cubic-bezier(.25,.46,.45,.94) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
  .glow { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
</style>
<defs>
  <radialGradient id="g" cx="50%" cy="110%" r="70%"><stop offset="0" stop-color="#D97757" stop-opacity=".35"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="400" rx="28" fill="#F0EEE6"/>
<rect class="glow" width="1280" height="400" rx="28" fill="url(#g)"/>
<g class="f" style="animation-duration:5.0s;animation-delay:-0.0s"><image href="data:image/webp;base64," x="60" y="40" width="88" height="88"/></g><g class="f" style="animation-duration:5.7s;animation-delay:-0.9s"><image href="data:image/webp;base64," x="160" y="140" width="88" height="88"/></g><g class="f" style="animation-duration:6.4s;animation-delay:-1.8s"><image href="data:image/webp;base64," x="1080" y="40" width="88" height="88"/></g><g class="f" style="animation-duration:7.1s;animation-delay:-2.7s"><image href="data:image/webp;base64," x="1170" y="150" width="88" height="88"/></g><g class="f" style="animation-duration:7.8s;animation-delay:-3.6s"><image href="data:image/webp;base64," x="60" y="285" width="88" height="88"/></g><g class="f" style="animation-duration:8.5s;animation-delay:-4.5s"><image href="data:image/webp;base64," x="1090" y="285" width="88" height="88"/></g>
<g class="t"><text x="640" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="104" fill="#1F1E1C" letter-spacing="-2">Skill <tspan fill="#D97757">Studio</tspan></text></g>
<path class="u" d="M490 228 H790" stroke="#D97757" stroke-width="8" stroke-linecap="round" stroke-dasharray="300"/>
<g class="s"><text x="640" y="292" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="#5E5A52">Every skill you own, one click away — inside Claude Code.</text></g>
</svg>